<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>%VITE_SITE_TITLE%</title>

        <!-- PWA head tags. The manifest <link> is injected automatically by
             vite-plugin-pwa at build time; these are the tags it does not manage
             and must survive index.html regeneration (env-config/indexTemplate.cjs). -->
        <meta name="theme-color" content="#1976d2" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="default"
        />
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <meta
            http-equiv="Content-Security-Policy"
            content="connect-src 'self' blob: http: https: ws: wss:;"
        />

        <!-- This is not a complete list since we allow Faithbridge and even allow user links in mark down-->
        <!-- 'self' blob: data: %VITE_CALLBACK% %VITE_SESSIONS% %VITE_NOTIFY% %VITE_HOST% https://%VITE_DOMAIN%/oauth/token %VITE_FILES% -->
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
